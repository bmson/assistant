# Single-image build for fast agent-only iteration. Used by release-fast.sh;
# the full release pipeline stays in cloudbuild.yaml.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        build,
        -f,
        infra/docker/agent.Dockerfile,
        -t,
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent:latest",
        -t,
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent:${_TAG}",
        .,
      ]
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent:latest"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent:${_TAG}"
substitutions:
  _REGION: us-west1
  _REPO: assistant
  _TAG: manual
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  env:
    - DOCKER_BUILDKIT=1
