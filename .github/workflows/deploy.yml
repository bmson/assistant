name: Deploy production

# The CI workflow runs for each push. This workflow starts only after that
# main-branch run succeeds, so an untested merge never reaches Cloud Run.
#
# workflow_dispatch is the escape hatch for the cases where that chain never
# fires at all: a commit pushed with [skip ci] produces no CI run, so no
# workflow_run event, so no deploy — and CI can also go red for reasons that
# have nothing to do with the commit (a freshly published advisory failing
# `pnpm audit`, a new HIGH CVE failing Trivy). Without a manual path the only
# way to ship a finished web change was an empty commit.
#
# ── Shape ────────────────────────────────────────────────────────────────────
# plan ─▶ image (one parallel job per image) ─▶ release
#
# The per-image work — build, scan, SBOM, push, sign — is seven independent
# pipelines that used to run as `for` loops on a single runner, and that was
# most of the deploy: 12m20s of a 17m release, against ~3m for the rollout
# that actually changes production. Nothing about `web` depends on `browser`,
# so the wall clock is now the slowest single image rather than the sum of all
# of them. Same images, same scans, same signatures, same rollout — only the
# scheduling changed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to release (defaults to the tip of main)
        required: false
        type: string
      persistence:
        description: Expected persistence driver; auto follows the live services
        required: false
        default: auto
        type: choice
        options:
          - auto
          - postgres
          - firestore
      components:
        description: Component set; web-only is accepted only when the live agent contract is proven compatible
        required: false
        default: full
        type: choice
        options:
          - full
          - web
      break_glass:
        description: Allow a release without a successful main-branch CI run for the exact SHA
        required: false
        default: false
        type: boolean
      break_glass_reason:
        description: Required audit reason when break_glass is enabled
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

# Installation identity comes from repository (or `production` environment)
# Variables — see infra/gcp/github-actions.md. Nothing about this workflow is
# tied to one GCP project, so forking it is a settings exercise, not an edit.
env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-west1' }}
  ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'assistant' }}

jobs:
  # ── plan ───────────────────────────────────────────────────────────────────
  # Resolves the two things every downstream job has to agree on: which commit
  # is being released, and which images that release contains. Both are job
  # outputs so a parallel fan-out cannot end up with jobs disagreeing about
  # either — the revision that goes live is the revision that was built.
  #
  # This job also carries the security guard for the whole workflow. Everything
  # else `needs:` it, and a skipped dependency skips its dependents, so the
  # check cannot be bypassed by a job that forgets to repeat it.
  plan:
    # The workflow_run guard must pin the triggering run to a push of this
    # repository's own main branch. `branches: [main]` alone is not that: it
    # filters on the run's head_branch, which for a pull_request-triggered CI
    # run is the PR author's branch name — including a fork branch named
    # "main". Without the head_repository and event checks, a fork PR whose CI
    # passes would start this job, check out the fork's commit, and execute its
    # package scripts and Dockerfiles under the production deploy identity.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      # One resolved commit for the whole release: the CI run's head on the
      # automatic path, the requested (or tip-of-main) commit on the manual one.
      # Everything downstream — checkout, image tags, the /api/health assertion
      # in release.sh — keys off this single value.
      sha: ${{ steps.release.outputs.sha }}
      images: ${{ steps.matrix.outputs.entries }}
      modules: ${{ steps.modules.outputs.modules }}
      persistence: ${{ steps.persistence.outputs.driver }}
      components: ${{ steps.components.outputs.components }}
    steps:
      - name: Resolve the release commit
        id: release
        env:
          RESOLVED_SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.sha || github.sha }}
        run: echo "sha=${RESOLVED_SHA}" >> "$GITHUB_OUTPUT"
      # Manual verification code comes from the trusted commit that contains
      # this workflow. The requested release SHA is checked out only after the
      # verifier approves it.
      - name: Checkout trusted workflow source for manual verifier
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      # Manual releases use the same exact-source gate as automatic releases.
      # The explicit, audited break-glass input is only for a deliberate
      # exception; dispatching this privileged workflow from another branch is
      # never allowed.
      - name: Verify exact source passed main CI
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          BREAK_GLASS: ${{ inputs.break_glass }}
          BREAK_GLASS_REASON: ${{ inputs.break_glass_reason }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash infra/gcp/verify-release-source.sh
      # Which release path the installation expects. A non-auto manual input wins,
      # then the PERSISTENCE_DRIVER repository variable (set it to firestore
      # after the cutover), then auto. release.sh always re-reads the live
      # services and refuses an expectation they contradict, so this only
      # narrows what is built and asserted; it never overrides production.
      - name: Resolve the persistence path
        id: persistence
        env:
          REQUESTED: ${{ (github.event.inputs.persistence != 'auto' && github.event.inputs.persistence) || vars.PERSISTENCE_DRIVER || 'auto' }}
        run: |
          case "$REQUESTED" in
            auto|postgres|firestore) echo "driver=${REQUESTED}" >> "$GITHUB_OUTPUT" ;;
            *) echo "PERSISTENCE_DRIVER must be auto, postgres, or firestore" >&2; exit 1 ;;
          esac
      - name: Resolve component selection
        id: components
        env:
          REQUESTED_COMPONENTS: ${{ github.event.inputs.components || 'full' }}
          PERSISTENCE_DRIVER: ${{ steps.persistence.outputs.driver }}
        run: |
          case "$REQUESTED_COMPONENTS" in
            full) echo "components=agent,web" >> "$GITHUB_OUTPUT" ;;
            web)
              if [ "$PERSISTENCE_DRIVER" = "auto" ]; then
                echo "web-only selection requires an explicit postgres or firestore persistence driver" >&2
                exit 1
              fi
              echo "components=web" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "components must be full or web" >&2; exit 1 ;;
          esac
      - name: Checkout exact release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.release.outputs.sha }}
      # modules:plan runs a pnpm script against workspace packages, so this
      # runner needs the same toolchain CI uses. The per-image jobs below do
      # not: everything they build happens inside the Dockerfiles.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve optional runtime images
        id: modules
        env:
          ASSISTANT_MODULES: ${{ vars.ASSISTANT_MODULES || 'all' }}
        run: pnpm modules:plan --github-output="$GITHUB_OUTPUT"
      # The matrix is data, not a list of copy-pasted jobs: an image and the
      # Dockerfile that builds it, with the optional ones appended only when
      # their module is enabled. Adding an image here is one line, and it picks
      # up the scan, the SBOM, and the signature with no further edits.
      - name: Resolve the release matrix
        id: matrix
        env:
          BUILD_BROWSER: ${{ steps.modules.outputs.browser }}
          BUILD_CODE: ${{ steps.modules.outputs.code }}
          BUILD_PROCESSOR: ${{ steps.modules.outputs.processor }}
          PERSISTENCE: ${{ steps.persistence.outputs.driver }}
          COMPONENTS: ${{ steps.components.outputs.components }}
        run: |
          entries='[]'
          add() {
            entries="$(jq -c --arg n "$1" --arg d "$2" '. + [{name: $n, dockerfile: $d}]' <<<"$entries")"
          }
          # The backup and migration images exist only for the PostgreSQL
          # release path. A Firestore release neither builds nor runs them.
          if [ "$PERSISTENCE" != "firestore" ] && [ "$COMPONENTS" = "agent,web" ]; then
            add backup infra/docker/backup.Dockerfile
            add migrate infra/docker/migrate.Dockerfile
          fi
          if [ "$COMPONENTS" = "agent,web" ]; then
            add agent infra/docker/agent.Dockerfile
          fi
          add web infra/docker/web.Dockerfile
          if [ "$COMPONENTS" = "agent,web" ] && [ "$BUILD_BROWSER" = "true" ]; then
            add browser infra/docker/browser-job.Dockerfile
          fi
          if [ "$COMPONENTS" = "agent,web" ] && [ "$BUILD_CODE" = "true" ]; then
            add code infra/docker/code-runner.Dockerfile
          fi
          if [ "$COMPONENTS" = "agent,web" ] && [ "$BUILD_PROCESSOR" = "true" ]; then
            add processor infra/docker/document-processor.Dockerfile
          fi
          echo "entries=${entries}" >> "$GITHUB_OUTPUT"
          echo "Releasing: $(jq -r '[.[].name] | join(", ")' <<<"$entries")"

  # ── image ──────────────────────────────────────────────────────────────────
  # One image, start to finish: built, scanned, inventoried, pushed, signed.
  # Keeping the whole per-image pipeline in one job is what lets it run on one
  # runner without shipping the image around — the build stays in that runner's
  # daemon, and the scan and the SBOM read it from there.
  #
  # Finish independent scans so a failed release reports every blocked image.
  # The release job still requires the entire matrix to succeed; images pushed
  # by successful siblings remain inert when any other image fails.
  image:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      RELEASE_SHA: ${{ needs.plan.outputs.sha }}
      IMAGE_NAME: ${{ matrix.entry.name }}
      DOCKERFILE: ${{ matrix.entry.dockerfile }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # The stock runner image leaves this job ~14GB of headroom, and exporting
      # an image to a tar for SBOM generation needs room beside the image
      # itself. That margin used to be a coin flip across seven images in one
      # job: run 30512378494 died at the syft step with "no space left on
      # device" on browser:TAG while an otherwise-identical run the day before
      # squeaked through. One image per runner is far more headroom than that
      # ever had, but the chromium-carrying browser image is big enough that
      # this stays for the Chromium-carrying browser image only. Other images
      # have enough headroom on their separate runners, while disk cleanup has
      # repeatedly delayed even the small backup and ordinary web image jobs.
      - name: Reclaim runner disk for the image build
        if: matrix.entry.name == 'browser'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Authorize Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Build the image
        env:
          # RUN --mount=type=cache in the Dockerfiles requires BuildKit.
          DOCKER_BUILDKIT: '1'
        run: |
          IMAGE_ROOT="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REPOSITORY}"
          args=(--file "$DOCKERFILE" --tag "${IMAGE_ROOT}/${IMAGE_NAME}:${RELEASE_SHA}")
          # Only the web image stamps the commit it was built from; that value
          # is what /api/health reports, and what release.sh asserts against.
          if [ "$IMAGE_NAME" = "web" ]; then
            args+=(--build-arg "GIT_SHA=${RELEASE_SHA}")
          fi
          docker build "${args[@]}" .
      - name: Verify web assets in the shipping image
        if: matrix.entry.name == 'web'
        run: |
          IMAGE_ROOT="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REPOSITORY}"
          bash scripts/smoke-web-image.sh "${IMAGE_ROOT}/${IMAGE_NAME}:${RELEASE_SHA}"
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REPOSITORY }}/${{ matrix.entry.name }}:${{ needs.plan.outputs.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Install SBOM tooling
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Generate the SBOM and push the image
        run: |
          IMAGE_ROOT="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REPOSITORY}"
          mkdir -p sbom
          syft "${IMAGE_ROOT}/${IMAGE_NAME}:${RELEASE_SHA}" \
            -o "spdx-json=sbom/${IMAGE_NAME}.spdx.json"
          docker push "${IMAGE_ROOT}/${IMAGE_NAME}:${RELEASE_SHA}"
      # One artifact per image rather than one for the release: a matrix job
      # cannot append to a shared artifact name, and merging them would mean
      # adding an action this repo has not pinned. They carry the same content
      # under the same release sha.
      - name: Upload the release SBOM
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: release-sboms-${{ needs.plan.outputs.sha }}-${{ matrix.entry.name }}
          path: sbom/*.spdx.json
          retention-days: 90
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image and attach its SBOM attestation
        run: |
          IMAGE_ROOT="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REPOSITORY}"
          ref="${IMAGE_ROOT}/${IMAGE_NAME}:${RELEASE_SHA}"
          cosign sign --yes "$ref"
          cosign attest --yes --type spdxjson --predicate "sbom/${IMAGE_NAME}.spdx.json" "$ref"

  # ── release ────────────────────────────────────────────────────────────────
  # The only job that changes production. release.sh picks the PostgreSQL or
  # Firestore release path from the live services (see infra/gcp/release.sh).
  # The PostgreSQL path runs exactly as before, against
  # images every one of which is now built, scanned, pushed and signed —
  # `needs: image` is the whole matrix, so a single failed image means no
  # rollout at all.
  release:
    needs: [plan, image]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # release.sh runs pnpm scripts against workspace packages.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Release immutable images
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.sha }}
          ASSISTANT_MODULES: ${{ needs.plan.outputs.modules }}
          RELEASE_PERSISTENCE_DRIVER: ${{ needs.plan.outputs.persistence }}
          RELEASE_COMPONENTS: ${{ needs.plan.outputs.components }}
          RELEASE_SCHEMA_UNCHANGED: ${{ needs.plan.outputs.components == 'web' && 'true' || 'false' }}
          RELEASE_EMAIL_OBSERVER_WORKER_ENABLED: ${{ vars.RELEASE_EMAIL_OBSERVER_WORKER_ENABLED }}
          RELEASE_MANIFEST_PATH: ${{ runner.temp }}/assistant-release-${{ needs.plan.outputs.sha }}.json
          SKIP_IMAGE_BUILD: 'true'
        run: bash infra/gcp/release.sh
      - name: Archive the immutable release manifest
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: release-manifest-${{ needs.plan.outputs.sha }}
          path: ${{ runner.temp }}/assistant-release-${{ needs.plan.outputs.sha }}.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Keep only the current deployment
        if: vars.CURRENT_ONLY_CLEANUP == 'true'
        run: >-
          python3 infra/gcp/cleanup-current.py
          --project "$GCP_PROJECT" --region "$GCP_REGION"
          --repository "$ARTIFACT_REPOSITORY" --apply
