name: Clean obsolete deployment versions

on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'

permissions:
  contents: read
  id-token: write

# Use the deployment lock: never delete images while a release is building.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  cleanup:
    if: vars.CURRENT_ONLY_CLEANUP == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-west1' }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'assistant' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Test cleanup protection
        run: PYTHONDONTWRITEBYTECODE=1 python3 infra/gcp/cleanup-current.test.py
      - name: Keep only the current deployment
        run: >-
          python3 infra/gcp/cleanup-current.py
          --project "$GCP_PROJECT" --region "$GCP_REGION"
          --repository "$ARTIFACT_REPOSITORY" --apply
