name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Separate jobs instead of one serial chain: static checks need neither Postgres
# nor a build, so they run alongside the database-backed verification, and the
# build+smoke job reuses caches instead of starting cold. Deploy keys off the
# workflow conclusion, which requires every job to pass.
#
# Every job carries a timeout-minutes, generously above its observed run but far
# under GitHub's six-hour default. A hung job is not a slow job: the browser
# smoke step once held a main-branch run open for the better part of an hour,
# and because a deploy keys off this workflow's conclusion, nothing shipped and
# nothing failed either — there was no signal to act on. A job that hangs should
# go red in minutes and upload its log, which is the only way to find out why.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Narrow brace-expansion overrides retain the 1.x and 2.x CommonJS export
      # shapes required by ExcelJS > archiver > glob > minimatch 3. The document
      # processor XLSX round-trip regression exercises that compatibility path.
      - run: pnpm audit --audit-level moderate
      - name: Scan repository for secrets and insecure configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
      - run: pnpm lint
      - name: Verify current deployment cleanup protection
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 infra/gcp/cleanup-current.test.py
          bash infra/gcp/verify-release-source.test.sh
          bash infra/ci/install-postgres17.test.sh
          bash infra/ci/postgres-service.test.sh
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_ci_postgres_workflow.py
      # 900+ lines of deploy bash run against production with no other check.
      - name: Lint shell scripts
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          bash -n infra/gcp/*.sh infra/docker/*.sh infra/ci/*.sh scripts/*.sh infra/ios-detect-changes.sh infra/ios-detect-changes.test.sh
          shellcheck --severity=warning infra/gcp/*.sh infra/docker/*.sh infra/ci/*.sh scripts/*.sh infra/ios-detect-changes.sh infra/ios-detect-changes.test.sh
          bash infra/ios-detect-changes.test.sh
          bash infra/gcp/release-diagnostics.test.sh
          bash infra/gcp/release.test.sh
          bash infra/docker/database-admin.test.sh
      # The Firestore runtime and release path must stay free of the retired
      # PostgreSQL database; PostgreSQL-only files are listed, not counted.
      - name: Check the Firestore path has no database dependency
        run: pnpm cutover:retirement-report --static-only
      # The doctor validates the default configuration end to end, including
      # every module's declared readiness and production rules.
      - run: pnpm config:check
      - name: Install Terraform for offline consumer checks
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false
      - name: Validate consumer infrastructure without cloud credentials
        working-directory: infra/gcp/consumer/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -lockfile=readonly
          terraform validate
          terraform test

  base-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pull and verify public Node 22 base image
        run: |
          image=public.ecr.aws/docker/library/node:22-slim
          docker pull "$image"
          version=$(docker run --rm "$image" node -p 'process.versions.node')
          [[ "$version" == 22.* ]]

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgres://assistant:assistant@localhost:5432/assistant
      TEST_DATABASE_URL: postgres://assistant:assistant@localhost:5432/assistant_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install PostgreSQL 17 and pgvector
        run: bash infra/ci/install-postgres17.sh
      - name: Start PostgreSQL service
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant
        run: bash infra/ci/postgres-service.sh start
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Remove owned PostgreSQL service
        if: always()
        run: bash infra/ci/postgres-service.sh cleanup

  firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8789
      GCLOUD_PROJECT: demo-assistant-test
      DATABASE_URL: postgres://assistant:assistant@localhost:5432/assistant_test
      TEST_DATABASE_URL: postgres://assistant:assistant@localhost:5432/assistant_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install PostgreSQL 17 and pgvector
        run: bash infra/ci/install-postgres17.sh
      - name: Start PostgreSQL service
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant
        run: bash infra/ci/postgres-service.sh start
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '576.0.0'
          install_components: cloud-firestore-emulator
      - run: pnpm install --frozen-lockfile
      # No cloud authentication, project creation, or billable API calls.
      - name: Verify Firestore transactions and vector retrieval
        shell: bash
        run: |
          gcloud emulators firestore start --host-port="$FIRESTORE_EMULATOR_HOST" --quiet > "$RUNNER_TEMP/firestore.log" 2>&1 &
          assistant_emulator_pid=$!
          trap 'kill "$assistant_emulator_pid" 2>/dev/null || true' EXIT
          assistant_emulator_ready=false
          for assistant_attempt in {1..60}; do
            if curl --fail --silent --output /dev/null "http://$FIRESTORE_EMULATOR_HOST"; then
              assistant_emulator_ready=true
              break
            fi
            if ! kill -0 "$assistant_emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/firestore.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$assistant_emulator_ready" != true ]; then
            cat "$RUNNER_TEMP/firestore.log"
            exit 1
          fi
          pnpm test:firestore
      - name: Remove owned PostgreSQL service
        if: always()
        run: bash infra/ci/postgres-service.sh cleanup

  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://assistant:assistant@localhost:5432/assistant
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install PostgreSQL 17 and pgvector
        run: bash infra/ci/install-postgres17.sh
      - name: Start PostgreSQL service
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant
        run: bash infra/ci/postgres-service.sh start
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # turbo.json declares outputs for both builds; persisting the caches is
      # what makes the declaration worth anything in CI.
      - name: Restore build caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm seed
      - name: Smoke the bundled agent process
        env:
          ASSISTANT_MODULES: minimal
          PERSISTENCE_DRIVER: postgres
          OPENROUTER_API_KEY: ci-smoke-only
          PORT: '8787'
        run: |
          node apps/agent/dist/index.mjs > "$RUNNER_TEMP/assistant-agent.log" 2>&1 &
          assistant_agent_pid=$!
          trap 'kill "$assistant_agent_pid" 2>/dev/null || true' EXIT
          assistant_agent_ready=false
          for assistant_attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8787/ready; then
              assistant_agent_ready=true
              break
            fi
            if ! kill -0 "$assistant_agent_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$assistant_agent_ready" != true ]; then
            cat "$RUNNER_TEMP/assistant-agent.log"
            exit 1
          fi
      # Smoke the production build that ships, not a dev-server recompile of
      # it. The standalone server pins NODE_ENV=production, so the dev bypass
      # would (correctly) throw; the loopback bypass is the production-shaped
      # path — and it now also exercises the request-level loopback guard.
      - name: Exercise mobile administration in a real browser
        env:
          AUTH_LOCALHOST_BYPASS: 'true'
          AUTH_URL: http://127.0.0.1:3000
          QUEUE_DRIVER: local
          SMOKE_BASE_URL: http://127.0.0.1:3000
          SMOKE_BROWSER_CHANNEL: chrome
          PORT: '3000'
          HOSTNAME: 127.0.0.1
        run: |
          # The standalone output carries the server, not the static assets.
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public 2>/dev/null || true
          node apps/web/.next/standalone/apps/web/server.js > "$RUNNER_TEMP/assistant-web.log" 2>&1 &
          assistant_web_pid=$!
          trap 'kill "$assistant_web_pid" 2>/dev/null || true' EXIT
          assistant_web_ready=false
          for assistant_attempt in {1..60}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then
              assistant_web_ready=true
              break
            fi
            sleep 1
          done
          if [ "$assistant_web_ready" != true ]; then
            cat "$RUNNER_TEMP/assistant-web.log"
            exit 1
          fi
          pnpm smoke:mobile
      - name: Remove owned PostgreSQL service
        if: always()
        run: bash infra/ci/postgres-service.sh cleanup
