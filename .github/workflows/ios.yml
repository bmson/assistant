name: iOS

permissions:
  contents: read

# A separate workflow rather than a fourth job in CI, deliberately.
#
# `deploy.yml` starts on the CI workflow's conclusion — "the AND of all three"
# jobs, as ci.yml puts it. Folding the iOS build into that AND would mean a
# broken Swift file, a macOS runner outage, or an Xcode image bump blocking a
# Cloud Run rollout of server code it has nothing to do with. `apps/ios` ships
# in no image and no compose service; its build result should gate the app, not
# production.
#
# "Build and test the iOS app" is a required status check, which is why the
# pull_request trigger below carries no `paths:` filter: a required check that
# never runs leaves a pull request blocked forever.
#
# Running on every pull request must not mean booting a macOS runner on every
# pull request — those minutes bill at ten times Linux. So the path test moved
# from the trigger into a cheap Linux job, and the macOS job is skipped when a
# pull request touches no iOS file. A skipped job satisfies a required check,
# where an absent one does not.
on:
  pull_request:
  # Every branch, not just main: a Swift change is worth checking before it
  # reaches a pull request. Pushes are not gated by branch protection, so this
  # trigger keeps its filter — nothing is waiting on a check that never appears.
  push:
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
      - 'infra/ios-detect-changes.sh'
      - 'infra/ios-detect-changes.test.sh'
  workflow_dispatch:

jobs:
  changes:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The diff needs both ends of the pull request, which the default
          # shallow fetch does not carry.
          fetch-depth: 0
      - name: Test iOS change filter
        run: bash infra/ios-detect-changes.test.sh
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash infra/ios-detect-changes.sh

  build:
    name: Build and test the iOS app
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The app targets iOS 18 but compiles iOS 26 APIs behind
      # `if #available(iOS 26.0, *)` — the Liquid Glass surfaces in ChatView.
      # Availability-gated code still has to type-check, so the *SDK* has to be
      # new enough even though the deployment target is not. Runner images move
      # under us, so take the newest Xcode present and print what that was:
      # when this fails, the log should say "no iOS 26 SDK" rather than leaving
      # someone to infer it from a `glassEffect` error.
      - name: Select the newest installed Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "::error::No Xcode found on this runner image."
            exit 1
          fi
          sudo xcode-select -s "$latest"
          echo "Using $latest"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      # Pinning a device name ties the workflow to whatever the runner image
      # happens to preinstall, which changes without notice. Resolve the newest
      # available iPhone simulator instead and fail loudly if there is none.
      - name: Resolve an iPhone simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available --json \
            | jq -r '.devices
                     | to_entries
                     | map(select(.key | test("SimRuntime.iOS")))
                     | sort_by(.key)
                     | map(.value[])
                     | map(select(.name | startswith("iPhone")))
                     | last
                     | .udid // empty')"
          if [ -z "$udid" ]; then
            echo "::error::No available iPhone simulator on this runner image."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"

      # Code signing is off: the project carries a DEVELOPMENT_TEAM for local
      # device builds, and a runner has no certificate for it. A simulator build
      # does not need one — and this job is here to prove the code compiles and
      # the tests pass, not to produce a shippable artifact. Releases are signed
      # and uploaded from Xcode; see apps/ios/docs/shipping.md.
      - name: Build and test
        env:
          DESTINATION_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild \
            -project apps/ios/Assistant.xcodeproj \
            -scheme Assistant \
            -destination "id=${DESTINATION_UDID}" \
            -resultBundlePath "${RUNNER_TEMP}/Assistant.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test 2>&1 | tee "${RUNNER_TEMP}/xcodebuild.log"

      # xcodebuild interleaves its diagnostics with thousands of lines of
      # compile commands, and the errors land wherever the parallel jobs
      # happened to be. Anyone reading this from a terminal — or through the
      # API, where a log is fetched by the tail — needs the five lines that
      # say what broke, at the end, where a failure is read from.
      - name: What failed
        if: failure()
        run: |
          echo "--- errors and test failures ---"
          grep -E "error:|Testing failed|failed \(|\*\* .* FAILED \*\*" \
            "${RUNNER_TEMP}/xcodebuild.log" \
            | sed -E 's|/Users/runner/work/aibot/aibot/||' \
            | sort -u \
            | head -60 \
            || echo "(no error lines matched; see the xcresult artifact)"

      # The result bundle carries the failing assertion and any crash logs,
      # which the console output truncates.
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: ios-xcresult-${{ github.sha }}
          path: ${{ runner.temp }}/Assistant.xcresult
          retention-days: 14
