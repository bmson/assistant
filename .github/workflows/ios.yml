# Temporary diagnostic branch only; no app or test source changes.
name: iOS stream readiness controlled validation

permissions:
  contents: read

# A separate workflow rather than a fourth job in CI, deliberately.
#
# `deploy.yml` starts on the CI workflow's conclusion — "the AND of all three"
# jobs, as ci.yml puts it. Folding the iOS build into that AND would mean a
# broken Swift file, a macOS runner outage, or an Xcode image bump blocking a
# Cloud Run rollout of server code it has nothing to do with. `apps/ios` ships
# in no image and no compose service; its build result should gate the app, not
# production.
#
# "Build and test the iOS app" is a required status check, which is why the
# pull_request trigger below carries no `paths:` filter: a required check that
# never runs leaves a pull request blocked forever.
#
# Running on every pull request must not mean booting a macOS runner on every
# pull request — those minutes bill at ten times Linux. So the path test moved
# from the trigger into a cheap Linux job, and the macOS job is skipped when a
# pull request touches no iOS file. A skipped job satisfies a required check,
# where an absent one does not.
on:
  pull_request:
  # Every branch, not just main: a Swift change is worth checking before it
  # reaches a pull request. Pushes are not gated by branch protection, so this
  # trigger keeps its filter — nothing is waiting on a check that never appears.
  push:
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
      - 'infra/ios-detect-changes.sh'
      - 'infra/ios-detect-changes.test.sh'
  workflow_dispatch:

jobs:
  changes:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The diff needs both ends of the pull request, which the default
          # shallow fetch does not carry.
          fetch-depth: 0
      - name: Test iOS change filter
        run: bash infra/ios-detect-changes.test.sh
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash infra/ios-detect-changes.sh

  build:
    name: Build and test the iOS app
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: production-base
            source: c790625c3f7f66da9dcf40b98d798c045f38735f
          - label: readiness-candidate
            source: ec8cf610478cc5baec4fac7fb0cd4a7c6ffd9713
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ matrix.source }}
      - name: Verify exact unmodified test source identity
        env:
          EXPECTED_SOURCE: ${{ matrix.source }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git status --porcelain
          shasum -a 256 apps/ios/AssistantTests/APIClientRetryTests.swift

      - name: Apply controlled delayed and missing state fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import hashlib
          import os

          path = Path('apps/ios/AssistantTests/APIClientRetryTests.swift')
          original = path.read_text()
          function = original.index('    func testChatFollowsNewMessagesAndGrowingStreamWhileAtBottom()')
          start = original.rfind('    @MainActor', 0, function)
          assert original[start:function].strip() == '@MainActor'
          end = original.index('    func testCardFormUnknownResponseReplaysTheExactFrozenBody()', function)
          section = original[start:end]
          variants = []
          for mode, name in [('mount', 'testControlledDelayedMount'), ('missing-mount', 'testControlledMissingMount'), ('delta', 'testControlledDelayedDelta'), ('missing', 'testControlledMissingDelta')]:
              test = section.replace('testChatFollowsNewMessagesAndGrowingStreamWhileAtBottom', name)
              if mode in ('mount', 'missing-mount'):
                  test = test.replace('window.rootViewController = UIHostingController(rootView:', 'let diagnosticRoot = UIHostingController(rootView:', 1)
                  test = test.replace('        window.makeKeyAndVisible()', '''        window.rootViewController = UIViewController()
                  var diagnosticMountTask: Task<Void, Never>?
                  window.makeKeyAndVisible()''', 1)
                  test = test.replace('            model.cancelSend()', '            diagnosticMountTask?.cancel()\n            model.cancelSend()', 1)
                  old = '        func descendants(_ view: UIView) -> [UIView] { [view] + view.subviews.flatMap(descendants) }'
                  new = r'''        func descendants(_ view: UIView) -> [UIView] {
                      if view === window, diagnosticMountTask == nil {
                          print("STREAM_CONTROL mount first-inspection gated")
                          diagnosticMountTask = Task {
                              try? await Task.sleep(for: .milliseconds(650))
                              guard !Task.isCancelled else { return }
                              window.rootViewController = diagnosticRoot
                              print("STREAM_CONTROL mount released after650ms")
                          }
                      }
                      return [view] + view.subviews.flatMap(descendants)
                  }'''
                  assert test.count(old) == 1
                  if mode == 'missing-mount':
                      new = '''        func descendants(_ view: UIView) -> [UIView] {
                      return [view] + view.subviews.flatMap(descendants)
                  }'''
                  test = test.replace(old, new)
              else:
                  test = test.replace('        window.makeKeyAndVisible()', '        var diagnosticDeliveryTask: Task<Void, Never>?\n        window.makeKeyAndVisible()', 1)
                  test = test.replace('            model.cancelSend()', '            diagnosticDeliveryTask?.cancel()\n            model.cancelSend()', 1)
                  old = '            StubURLProtocol.appendStream(try chunk(delta))'
                  if mode == 'delta':
                      new = r'''            let diagnosticBytes = try chunk(delta)
                      if index == 3 {
                          print("STREAM_CONTROL delta3 scheduled650ms")
                          diagnosticDeliveryTask = Task {
                              try? await Task.sleep(for: .milliseconds(650))
                              guard !Task.isCancelled else { return }
                              StubURLProtocol.appendStream(diagnosticBytes)
                              print("STREAM_CONTROL delta3 released after650ms")
                          }
                      } else {
                          StubURLProtocol.appendStream(diagnosticBytes)
                      }'''
                  else:
                      new = r'''            if index == 3 {
                          print("STREAM_CONTROL delta3 deliberately withheld")
                      } else {
                          StubURLProtocol.appendStream(try chunk(delta))
                      }'''
                  assert test.count(old) == 1
                  test = test.replace(old, new)
              variants.append(test)
          modified = original[:start] + '\n'.join(variants) + original[end:]
          output = Path(os.environ.get('RUNNER_TEMP', '/tmp')) / 'stream-controls'
          output.mkdir(parents=True, exist_ok=True)
          (output / 'APIClientRetryTests.original.swift').write_text(original)
          (output / 'APIClientRetryTests.controlled.swift').write_text(modified)
          (output / 'controls.diff').write_text(''.join(difflib.unified_diff(original.splitlines(True), modified.splitlines(True), fromfile='original', tofile='controlled')))
          print('STREAM_CONTROL_SOURCE original=' + hashlib.sha256(original.encode()).hexdigest())
          print('STREAM_CONTROL_SOURCE controlled=' + hashlib.sha256(modified.encode()).hexdigest())
          path.write_text(modified)
          PY

      # The app targets iOS 18 but compiles iOS 26 APIs behind
      # `if #available(iOS 26.0, *)` — the Liquid Glass surfaces in ChatView.
      # Availability-gated code still has to type-check, so the *SDK* has to be
      # new enough even though the deployment target is not. Runner images move
      # under us, so take the newest Xcode present and print what that was:
      # when this fails, the log should say "no iOS 26 SDK" rather than leaving
      # someone to infer it from a `glassEffect` error.
      - name: Select the newest installed Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "::error::No Xcode found on this runner image."
            exit 1
          fi
          sudo xcode-select -s "$latest"
          echo "Using $latest"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      # Pinning a device name ties the workflow to whatever the runner image
      # happens to preinstall, which changes without notice. Resolve the newest
      # available iPhone simulator instead and fail loudly if there is none.
      - name: Resolve an iPhone simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available --json \
            | jq -r '.devices
                     | to_entries
                     | map(select(.key | test("SimRuntime.iOS")))
                     | sort_by(.key)
                     | map(.value[])
                     | map(select(.name | startswith("iPhone")))
                     | last
                     | .udid // empty')"
          if [ -z "$udid" ]; then
            echo "::error::No available iPhone simulator on this runner image."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"

      # Code signing is off: the project carries a DEVELOPMENT_TEAM for local
      # device builds, and a runner has no certificate for it. A simulator build
      # does not need one — and this job is here to prove the code compiles and
      # the tests pass, not to produce a shippable artifact. Releases are signed
      # and uploaded from Xcode; see apps/ios/docs/shipping.md.
      - name: Build and test
        env:
          DESTINATION_UDID: ${{ steps.simulator.outputs.udid }}
          CONTROL_SOURCE_LABEL: ${{ matrix.label }}
        run: |
          set -o pipefail
          xcodebuild \
            -project apps/ios/Assistant.xcodeproj \
            -scheme Assistant \
            -destination "id=${DESTINATION_UDID}" \
            -derivedDataPath "${RUNNER_TEMP}/Assistant-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build-for-testing 2>&1 | tee "${RUNNER_TEMP}/xcodebuild.log"
          # The device contains no accounts. Grant only this test app access so
          # the EventKit fixture exercises real recurring-event reads, with its
          # own temporary calendar removed at the end of the test.
          xcrun simctl bootstatus "$DESTINATION_UDID" -b
          xcrun simctl install "$DESTINATION_UDID" \
            "${RUNNER_TEMP}/Assistant-build/Build/Products/Debug-iphonesimulator/Assistant.app"
          xcrun simctl privacy "$DESTINATION_UDID" grant calendar com.baldvinsmarason.assistant
          mkdir -p "${RUNNER_TEMP}/stream-controls"
          set +e
          xcodebuild \
            -project apps/ios/Assistant.xcodeproj \
            -scheme Assistant \
            -destination "id=${DESTINATION_UDID}" \
            -derivedDataPath "${RUNNER_TEMP}/Assistant-build" \
            -resultBundlePath "${RUNNER_TEMP}/stream-controls/Controlled.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -only-testing:AssistantTests/APIClientRetryTests/testControlledDelayedMount \
            -only-testing:AssistantTests/APIClientRetryTests/testControlledMissingMount \
            -only-testing:AssistantTests/APIClientRetryTests/testControlledDelayedDelta \
            -only-testing:AssistantTests/APIClientRetryTests/testControlledMissingDelta \
            test-without-building 2>&1 | tee -a "${RUNNER_TEMP}/xcodebuild.log"
          result=${PIPESTATUS[0]}
          set -e
          echo "Controlled XCTest exit=${result}; expected failure assertions are validated below"
          xcrun xcresulttool get test-results summary --path "${RUNNER_TEMP}/stream-controls/Controlled.xcresult" > "${RUNNER_TEMP}/stream-controls/summary.json"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          p=Path(os.environ['RUNNER_TEMP'])/'stream-controls/summary.json'
          s=json.loads(p.read_text())
          expected={'testControlledMissingMount()','testControlledMissingDelta()'}
          if os.environ['CONTROL_SOURCE_LABEL']=='production-base':
              expected|={'testControlledDelayedMount()','testControlledDelayedDelta()'}
          actual={x['testName'] for x in s.get('testFailures',[])}
          assert actual==expected,(actual,expected)
          assert s['failedTests']==len(expected) and s['passedTests']==4-len(expected) and s['skippedTests']==0
          for f in s['testFailures']:
              assert ('XCTUnwrap failed' if 'Mount' in f['testName'] else 'XCTAssertEqual failed') in f['failureText']
          print('CONTROL_VERDICT expected assertion failures retained:',sorted(actual),'passed:',s['passedTests'])
          PY

      # xcodebuild interleaves its diagnostics with thousands of lines of
      # compile commands, and the errors land wherever the parallel jobs
      # happened to be. Anyone reading this from a terminal — or through the
      # API, where a log is fetched by the tail — needs the five lines that
      # say what broke, at the end, where a failure is read from.
      - name: What failed
        if: failure()
        run: |
          echo "--- errors and test failures ---"
          grep -E "error:|Testing failed|failed \(|\*\* .* FAILED \*\*" \
            "${RUNNER_TEMP}/xcodebuild.log" \
            | sed -E 's|/Users/runner/work/aibot/aibot/||' \
            | sort -u \
            | head -60 \
            || echo "(no error lines matched; see the xcresult artifact)"

      # Keep native screenshots for review as well as failure diagnostics.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: stream-controls-${{ matrix.label }}-${{ matrix.source }}
          path: |
            ${{ runner.temp }}/stream-controls
            ${{ runner.temp }}/xcodebuild.log
          retention-days: 14
