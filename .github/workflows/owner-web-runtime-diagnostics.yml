name: Read bounded web runtime diagnostics
on:
  workflow_dispatch:
    inputs:
      reviewed_source_sha:
        description: Exact reviewed main diagnostic source SHA
        type: string
        required: true
      start:
        description: Reviewed UTC window start, millisecond ISO format, within24hours
        type: string
        required: true
      end:
        description: Reviewed UTC window end, at most15minutes after start
        type: string
        required: true
      include_historical:
        description: Also read only the exact previously reviewed01080-hel revision
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      RUNTIME_DIAGNOSTIC_REVIEWED_SOURCE: ${{ inputs.reviewed_source_sha }}
      RUNTIME_DIAGNOSTIC_START: ${{ inputs.start }}
      RUNTIME_DIAGNOSTIC_END: ${{ inputs.end }}
      RUNTIME_DIAGNOSTIC_INCLUDE_HISTORICAL: ${{ inputs.include_historical }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify reviewed source and bounded window before cloud authentication
        run: pnpm exec tsx scripts/owner-web-runtime-diagnostics-command.ts --verify-source
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: 576.0.0
          cache: true
      - name: Read fixed configuration and bounded request timing only
        run: pnpm exec tsx scripts/owner-web-runtime-diagnostics-command.ts --read
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: owner-web-runtime-diagnostics-${{ github.sha }}-${{ github.run_id }}
          path: owner-web-runtime-diagnostics.json
          if-no-files-found: error
          retention-days: 1
