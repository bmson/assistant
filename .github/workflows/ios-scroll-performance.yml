name: iOS scroll performance

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline commit or ref
        required: true
        default: 14ba202b8c9593623f3fe3c817319c15e40f6ffa
        type: string
      candidate_ref:
        description: Candidate commit or ref (defaults to this dispatch SHA)
        required: false
        type: string
      repeats:
        description: Test repeats per variant (1–5)
        required: true
        default: '5'
        type: choice
        options: ['1', '2', '3', '4', '5']
      run_mode:
        description: Run bottom-follow correctness, gated smoke, or the untraced fixed-window paired matrix
        required: true
        default: smoke
        type: choice
        options: [correctness, smoke, matrix]
  push:
    branches:
      - codex/ios-chat-scroll-performance
    paths:
      - 'apps/ios/Assistant/**'
      - 'apps/ios/AssistantTests/ConversationScrollPerformanceTests.swift'
      - 'apps/ios/AssistantTests/ConversationPerformanceFixture.swift'
      - '.github/workflows/ios-scroll-performance.yml'
      - 'infra/ios-scroll-performance.sh'
      - 'infra/ios-scroll-fixtures/**'

permissions:
  contents: read

jobs:
  benchmark:
    name: Compare iOS conversation scrolling
    runs-on: macos-latest
    timeout-minutes: 100
    steps:
      - name: Check out benchmark source and refs
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Prepare worktrees and build benchmark tests
        env:
          BASELINE_REF: ${{ inputs.baseline_ref || '14ba202b8c9593623f3fe3c817319c15e40f6ffa' }}
          CANDIDATE_REF: ${{ inputs.candidate_ref || (github.event_name == 'push' && 'f9c3e387ba94ce4c335f2f5eba229d7da1cecedb') || github.sha }}
          REPEATS: ${{ inputs.repeats || '5' }}
          RUN_MODE: ${{ (github.event_name == 'push' && 'smoke') || inputs.run_mode || 'diagnostic' }}
          PHASE: build
          RUNNER_TEMP: ${{ runner.temp }}
        run: bash infra/ios-scroll-performance.sh

      - name: Run benchmark tests
        env:
          BASELINE_REF: ${{ inputs.baseline_ref || '14ba202b8c9593623f3fe3c817319c15e40f6ffa' }}
          CANDIDATE_REF: ${{ inputs.candidate_ref || (github.event_name == 'push' && 'f9c3e387ba94ce4c335f2f5eba229d7da1cecedb') || github.sha }}
          REPEATS: ${{ inputs.repeats || '5' }}
          RUN_MODE: ${{ (github.event_name == 'push' && 'smoke') || inputs.run_mode || 'diagnostic' }}
          PHASE: runtime
          RUNNER_TEMP: ${{ runner.temp }}
        run: bash infra/ios-scroll-performance.sh

      - name: Upload archived raw test and profiler bundles
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: ios-scroll-performance-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-scroll-performance/raw-xcresults.tar.gz
          retention-days: 14
          if-no-files-found: warn

      - name: Upload compact diagnostics and logs
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: ios-scroll-performance-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ios-scroll-performance/*.log
            ${{ runner.temp }}/ios-scroll-performance/*.txt
            ${{ runner.temp }}/ios-scroll-performance/*.xml
            ${{ runner.temp }}/ios-scroll-performance/*.json
            ${{ runner.temp }}/ios-scroll-performance/compact-diagnostics/**
          retention-days: 14
          if-no-files-found: warn
