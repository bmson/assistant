name: Observe owner editor release prerequisites

on:
  workflow_dispatch:
    inputs:
      observation_mode:
        description: Separate reviewed read allocation; recovery proof is encrypted and never a crypto PASS
        type: choice
        default: prerequisites
        options:
          - prerequisites
          - recovery-pair
      prerequisites_source_sha:
        description: Approved exact run, workflow and checkout SHA; required for prerequisites only
        type: string
        required: false
      prerequisites_project_sha256:
        description: Approved SHA256 of exact configured project bytes; prerequisites only
        type: string
        required: false
      prerequisites_service_account_sha256:
        description: Approved SHA256 of exact configured service account bytes; prerequisites only
        type: string
        required: false
      prerequisites_wif_provider_sha256:
        description: Approved SHA256 of exact configured WIF provider bytes; prerequisites only
        type: string
        required: false
      recovery_source_sha:
        description: Exact approved current main SHA; recovery-pair only
        type: string
        required: false
      recovery_approval_expires_at:
        description: Approved UTC start deadline, at most 30 minutes ahead; recovery-pair only
        type: string
        required: false
      recovery_recipient_public_key:
        description: Existing operator RSA public key only; private key never leaves operator
        type: string
        required: false
      diagnostic_source_sha:
        description: Exact reviewed current main SHA, required only for encrypted failure diagnosis
        type: string
        required: false
      diagnostic_recipient_public_key:
        description: Ephemeral RSA public key only; private key stays with the local reviewer
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && (inputs.observation_mode == '' || inputs.observation_mode == 'prerequisites')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      OWNER_EDITOR_APPROVED_SOURCE_SHA: ${{ inputs.prerequisites_source_sha }}
      OWNER_EDITOR_APPROVED_PROJECT_SHA256: ${{ inputs.prerequisites_project_sha256 }}
      OWNER_EDITOR_APPROVED_SERVICE_ACCOUNT_SHA256: ${{ inputs.prerequisites_service_account_sha256 }}
      OWNER_EDITOR_APPROVED_WIF_PROVIDER_SHA256: ${{ inputs.prerequisites_wif_provider_sha256 }}
      OWNER_EDITOR_DIAGNOSTIC_SOURCE_SHA: ${{ inputs.diagnostic_source_sha }}
      OWNER_EDITOR_DIAGNOSTIC_RECIPIENT_PUBLIC_KEY: ${{ inputs.diagnostic_recipient_public_key }}
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout candidate manifest as data only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 04c17b04ab9d76d005b04121927c189baa6edaf9
          path: .approved-index-source
          sparse-checkout: infra/gcp/firestore
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify fixed target and manifest before cloud authentication
        run: OWNER_EDITOR_CHECKOUT_SHA="$(git rev-parse HEAD)" pnpm exec tsx scripts/owner-editor-release-inventory.ts --verify-source
      - name: Authenticate with existing protected WIF identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: 576.0.0
      - name: Read bounded prerequisite observations only
        run: pnpm exec tsx scripts/owner-editor-release-inventory.ts --collect
      - name: Retain sanitized observation receipt only
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: owner-editor-release-inventory-${{ github.sha }}-${{ github.run_id }}
          path: owner-editor-release-inventory.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain encrypted bounded command failure only
        if: ${{ always() && inputs.diagnostic_recipient_public_key != '' }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: owner-editor-inventory-encrypted-failure-${{ github.sha }}-${{ github.run_id }}
          path: owner-editor-inventory-failure.encrypted.json
          if-no-files-found: ignore
          retention-days: 1

  recovery-pair:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.observation_mode == 'recovery-pair'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      RECOVERY_MODE: ${{ inputs.observation_mode }}
      RECOVERY_SOURCE_SHA: ${{ inputs.recovery_source_sha }}
      RECOVERY_APPROVAL_EXPIRES_AT: ${{ inputs.recovery_approval_expires_at }}
      RECOVERY_RECIPIENT_PUBLIC_KEY: ${{ inputs.recovery_recipient_public_key }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify source and recipient before any authentication
        run: |
          python3 scripts/owner_editor_recovery_pair.py --verify-source
          node scripts/owner-editor-recovery-envelope.mjs --verify-recipient
      - name: Read exact recovery proof objects with bounded existing WIF only
        run: python3 scripts/owner_editor_recovery_pair.py --collect
      - name: Encrypt proof objects for the existing operator recipient
        run: node scripts/owner-editor-recovery-envelope.mjs --seal
      - name: Remove private raw objects even after failure or cancellation
        if: always()
        run: python3 scripts/owner_editor_recovery_pair.py --cleanup
      - name: Retain encrypted proof objects only
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: owner-editor-recovery-proof-${{ github.sha }}-${{ github.run_id }}
          path: owner-editor-recovery-pair.encrypted.json
          if-no-files-found: error
          retention-days: 1
      - name: Retain closed collection outcome
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: owner-editor-recovery-outcome-${{ github.sha }}-${{ github.run_id }}
          path: owner-editor-recovery-pair-receipt.json
          if-no-files-found: ignore
          retention-days: 14
