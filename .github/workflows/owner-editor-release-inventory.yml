name: Observe owner editor release prerequisites

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout candidate manifest as data only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 04c17b04ab9d76d005b04121927c189baa6edaf9
          path: .approved-index-source
          sparse-checkout: infra/gcp/firestore
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify fixed target and manifest before cloud authentication
        run: pnpm exec tsx scripts/owner-editor-release-inventory.ts --verify-source
      - name: Authenticate with existing protected WIF identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: 576.0.0
      - name: Read bounded prerequisite observations only
        run: pnpm exec tsx scripts/owner-editor-release-inventory.ts --collect
      - name: Retain sanitized observation receipt only
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: owner-editor-release-inventory-${{ github.sha }}-${{ github.run_id }}
          path: owner-editor-release-inventory.json
          if-no-files-found: error
          retention-days: 14
